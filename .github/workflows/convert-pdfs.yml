name: Convert PDFs to Markdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MarkItDown
        run: python -m pip install -r requirements.txt
      - name: Convert PDFs and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          pdfs=(pdfs/*.pdf pdfs/*.PDF)
          if (( ${#pdfs[@]} == 0 )); then
            echo "No PDF files found in pdfs/. Add files you are authorized to process and run this workflow again. PDFs committed to a public repository are visible to everyone." >&2
            exit 1
          fi
          python skills/convert-pdf-to-markdown/scripts/convert_pdf.py "${pdfs[@]}" \
            --output-dir converted-markdown \
            --release-repo "${GITHUB_REPOSITORY}" | tee conversion-results.txt
          release_url="$(awk -F '\t' '$1 == "RELEASE" {print $2}' conversion-results.txt)"
          if [[ -z "$release_url" ]]; then
            echo "Conversion completed without a release URL." >&2
            exit 1
          fi
          {
            echo "## Markdown release"
            echo
            echo "Release: $release_url"
            echo
            awk -F '\t' '$1 == "ASSET" {printf "- [%s](%s)\n", $2, $3}' conversion-results.txt
          } >> "$GITHUB_STEP_SUMMARY"
